# Display lazygit
bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit

# Run Claude Code in a separate session
bind -r y run-shell '\
  SESSION="claude-$(echo #{pane_current_path} | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "claude"; \
  tmux display-popup -w80% -h80% -E "tmux attach-session -t $SESSION"'

# ─── IDE layout ───────────────────────────────────────────────────────────────
# prefix + i  -> nvim across the top, three shells across the bottom:
#
#   ┌─────────────────────────────┐
#   │            nvim             │  ~70%
#   ├─────────┬─────────┬─────────┤
#   │  shell  │  shell  │  shell  │  ~30%
#   └─────────┴─────────┴─────────┘
#
# Splits are taken from the bottom pane each time so the three end up as
# siblings in one row rather than nesting inside each other. -c keeps every
# pane in the directory the binding was pressed from.
bind i new-window -c '#{pane_current_path}' -n ide \; \
  send-keys 'nvim .' C-m \; \
  split-window -v -p 30 -c '#{pane_current_path}' \; \
  split-window -h -p 66 -c '#{pane_current_path}' \; \
  split-window -h -p 50 -c '#{pane_current_path}' \; \
  select-pane -t 0

# Same layout, but reuse the current window instead of opening a new one.
bind I split-window -v -p 30 -c '#{pane_current_path}' \; \
  split-window -h -p 66 -c '#{pane_current_path}' \; \
  split-window -h -p 50 -c '#{pane_current_path}' \; \
  select-pane -t 0

# Close every window in this session but the current one, then close the ide
# window's extra panes. Confirms first -- this throws away running processes.
bind X confirm-before -p "close all other windows in this session? (y/n)" \
  "kill-window -a"

# Close the whole session (detaches and destroys it, killing every window).
# Useful for tearing down an `ide` session in one keystroke.
bind Q confirm-before -p "kill this entire session? (y/n)" "kill-session"

# ─── Pane navigation ──────────────────────────────────────────────────────────
# tmux-pain-control is declared in tmux.conf but tpm was never installed
# (~/.config/tmux/plugins/ does not exist), so none of its bindings were ever
# loaded -- that is why h/j/k/l did nothing. Bound here directly so pane
# movement does not depend on a plugin.
#
# -r allows repeating without re-pressing the prefix.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize with the shifted versions
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Splits that keep the current directory
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'

# Window switching
bind -r n next-window
bind -r p previous-window

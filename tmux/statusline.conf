# vim: ft=tmux
#
# statusline -- solarized-sonokai, bubbles style, transparent
#
# Each segment is capped with  /  half-circles so it reads as a pill,
# after lualine's bubbles example. The cap glyph takes the segment colour as
# its fg and the bar colour as its bg -- that is what rounds the ends instead
# of leaving a square block.
#
# Background/neutrals from solarized-osaka (base03 #002c38, base04 #001419),
# accents from sonokai. Same palette the nvim colorscheme uses, so the tmux bar
# and lualine read as one surface.

set -g mode-style "fg=#001419,bg=#e7c664"

set -g message-style "fg=#001419,bg=#e7c664"
set -g message-command-style "fg=#001419,bg=#e7c664"

set -g pane-border-style "fg=#063540"
set -g pane-active-border-style "fg=#76cce0"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=#7f8490,bg=default"
set -g status-bg "default"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

# left:  session  >  user
set -g status-left "#[fg=#76cce0,bg=default]#[fg=#001419,bg=#76cce0,bold]  #S:#I.#P #[fg=#76cce0,bg=default] #[fg=#9ed072,bg=default]#[fg=#001419,bg=#9ed072,bold]  #(whoami) #[fg=#9ed072,bg=default] "

# right: date  <  host
set -g status-right "#[fg=#7f8490,bg=default]#[fg=#001419,bg=#7f8490] 󰃰 %d %b %H:%M #[fg=#7f8490,bg=default] #[fg=#b39df3,bg=default]#[fg=#001419,bg=#b39df3,bold] 󰇅 #h #[fg=#b39df3,bg=default] "

setw -g window-status-activity-style "underscore,fg=#e2e2e3,bg=default"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#7f8490,bg=default"
setw -g window-status-format '#[fg=#7f8490,bg=default]  #I  #{b:pane_current_path} '
setw -g window-status-current-format '#[fg=#e7c664,bg=default]#[fg=#001419,bg=#e7c664,bold] #I  #{b:pane_current_path} #[fg=#e7c664,bg=default]'

# osx clipboard
#
# NOTE: this used to set default-command from $SHELL, which is /bin/zsh on this
# machine. macos.conf is sourced AFTER tmux.conf, so it silently undid the
# `set-option -g default-command /opt/homebrew/bin/fish` there and every new
# pane came up in zsh. Use fish explicitly instead of $SHELL.
#
# reattach-to-user-namespace is only needed on macOS < 10.12; modern tmux has
# working pasteboard access on its own, so it is no longer wrapped here.
set-option -g default-command /opt/homebrew/bin/fish

# Undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

